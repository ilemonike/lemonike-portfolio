<style>
  :root { --lemon-bg: #f3fcfd; --lemon-ink: #111; --lemon-coral: #ff8e75; --lemon-muted: #737b7c; }
  body { background: var(--lemon-bg); color: var(--lemon-ink); font-family: Inter, Arial, sans-serif; }
  header h1 { color: var(--lemon-ink); font-family: Arial, sans-serif; font-weight: 500; letter-spacing: .08em; }
  header p { color: var(--lemon-muted); }
  aside { background: rgba(243,252,253,.97); border: 1.5px solid var(--lemon-ink); border-radius: 18px; box-shadow: none; }
  .eyebrow, .section-heading, summary { color: var(--lemon-muted); }
  h2 { color: var(--lemon-ink); font-family: Arial, sans-serif; font-weight: 400; letter-spacing: -.02em; }
  .live-dot { color: var(--lemon-coral); }
  .live-dot:before { background: var(--lemon-coral); }
  .section { border-top-color: rgba(17,17,17,.18); }
  .section-heading b, summary b { color: var(--lemon-ink); }
  .field span { color: var(--lemon-muted); }
  aside select, aside input[type=text] { border-color: var(--lemon-ink) !important; background: #fff !important; color: var(--lemon-ink); border-radius: 999px !important; }
  aside input[type=range] { accent-color: var(--lemon-coral); }
  aside input[type=color] { border-color: var(--lemon-ink) !important; background: #fff; border-radius: 50%; }
  button { background: var(--lemon-ink); color: #fff; border-radius: 999px; }
  button:hover { background: var(--lemon-coral); color: var(--lemon-ink); }
  .icon-tool[aria-pressed="true"] { background: var(--lemon-coral); color: var(--lemon-ink); border-color: var(--lemon-ink); }
  .tool-divider { background: rgba(17,17,17,.18); }
  small { color: var(--lemon-muted); }
  body.embedded { background: transparent; }
  body.embedded aside { background: rgba(243,252,253,.98); }
</style>

function view(angle=0){const box=new THREE.Box3().setFromObject(group),size=box.getSize(new THREE.Vector3());const d=Math.max(size.y,size.x/camera.aspect)/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.3;camera.position.set(Math.sin(angle)*d,angle?d*.06:0,Math.cos(angle)*d);controls.target.set(0,0,0);controls.update();}
view(.28);
document.getElementById('color').oninput=()=>refreshPaint();
document.getElementById('material').onchange=e=>{const presets={matte:[.92,0],rubber:[1,0],metal:[.4,.85],gloss:[.26,0]};const [r,m]=presets[e.target.value];material.roughness=r;material.metalness=m;document.getElementById('rough').value=r;};

document.querySelector('#depth').oninput=e=>{depth=+e.target.value;document.querySelector('#dv').textContent=depth;rebuild();};document.querySelector('#bevel').oninput=e=>{bevel=+e.target.value;document.querySelector('#bv').textContent=bevel;rebuild();};document.querySelector('#rough').oninput=e=>material.roughness=+e.target.value;
document.querySelector('#save').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.download='leona-matte-3d.png';a.href=renderer.domElement.toDataURL('image/png');a.click();};
addEventListener('resize',()=>{vp=viewport();camera.aspect=vp.w/vp.h;camera.updateProjectionMatrix();renderer.setSize(vp.w,vp.h);view(.28);});

const paintLayer=document.createElement('canvas');paintLayer.width=paintLayer.height=2048;
const paintCtx=paintLayer.getContext('2d');const surface=document.createElement('canvas');surface.width=surface.height=2048;const surfaceCtx=surface.getContext('2d');
const paintTexture=new THREE.CanvasTexture(surface);paintTexture.colorSpace=THREE.SRGBColorSpace;paintTexture.anisotropy=renderer.capabilities.getMaxAnisotropy();material.map=paintTexture;material.color.set('#ffffff');material.needsUpdate=true;
function refreshPaint(){surfaceCtx.fillStyle=document.getElementById('color').value;surfaceCtx.fillRect(0,0,2048,2048);surfaceCtx.drawImage(paintLayer,0,0);paintTexture.needsUpdate=true;}
refreshPaint();let painting=false,erasing=false,down=false,last=null;const history=[];const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();
const modeButton=document.getElementById('paintmode'),eraserButton=document.getElementById('eraser');
function setPaintMode(mode){painting=mode!=='rotate';erasing=mode==='erase';controls.enabled=!painting;modeButton.setAttribute('aria-pressed',String(painting&&!erasing));eraserButton.setAttribute('aria-pressed',String(erasing));renderer.domElement.style.cursor=painting?'crosshair':'grab';}
modeButton.onclick=()=>setPaintMode(painting&&!erasing?'rotate':'brush');
eraserButton.onclick=()=>setPaintMode(erasing?'rotate':'erase');
function savePaint(){history.push(paintCtx.getImageData(0,0,2048,2048));if(history.length>12)history.shift();}
document.getElementById('undo').onclick=()=>{if(history.length){paintCtx.putImageData(history.pop(),0,0);refreshPaint();}};
document.getElementById('clearpaint').onclick=()=>{savePaint();paintCtx.clearRect(0,0,2048,2048);refreshPaint();};
function hitPoint(e){const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(group.children,false)[0];if(!hit||!hit.uv)return null;return {x:hit.uv.x*2048,y:(1-hit.uv.y)*2048};}
function stroke(e){const pt=hitPoint(e);if(!pt){last=null;return;}paintCtx.globalCompositeOperation=erasing?'destination-out':'source-over';paintCtx.strokeStyle=document.getElementById('brushcolor').value;paintCtx.fillStyle=paintCtx.strokeStyle;paintCtx.lineWidth=+document.getElementById('brushsize').value*2.048;paintCtx.lineCap='round';paintCtx.lineJoin='round';paintCtx.beginPath();if(last){paintCtx.moveTo(last.x,last.y);paintCtx.lineTo(pt.x,pt.y);paintCtx.stroke();}else{paintCtx.arc(pt.x,pt.y,paintCtx.lineWidth/2,0,Math.PI*2);paintCtx.fill();}last=pt;refreshPaint();}
renderer.domElement.style.touchAction='none';
renderer.domElement.addEventListener('pointerdown',e=>{if(!painting)return;e.preventDefault();savePaint();down=true;last=null;renderer.domElement.setPointerCapture(e.pointerId);stroke(e);});
renderer.domElement.addEventListener('pointermove',e=>{if(down&&painting)stroke(e);});
for(const event of ['pointerup','pointercancel'])renderer.domElement.addEventListener(event,()=>{down=false;last=null;});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></html>
